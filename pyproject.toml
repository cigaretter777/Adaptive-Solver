[project]
name = "adaptive-math-rl"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.9,<3",
  "sympy>=1.13,<2",
  "math-verify>=0.7,<1",
  "orjson>=3.10,<4",
  "pyarrow>=17,<20",
  "datasets>=3,<4",
  "datasketch>=1.6,<2",
  "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "hypothesis>=6.112,<7",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adaptive_math"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py312"
# V1 prototype files stay readable during migration (master roadmap):
# lint scope is the adaptive_math package and its tests. Remove an entry
# once the corresponding legacy file is migrated or deleted.
exclude = [
  "src/main.py",
  "src/__init__.py",
  "src/config",
  "src/graph",
  "src/llm",
  "src/rl",
  "src/router",
  "tests/__init__.py",
  "tests/test_graph.py",
  "tests/test_rl.py",
  "tests/test_router.py",
  "examples",
  "autodl_train.py",
]

[tool.ruff.lint.per-file-ignores]
# The verifier boundary deliberately never lets untrusted input or teardown
# failures propagate: broad catches and best-effort cleanup are the contract,
# pinned by tests/contract/test_verifier_worker.py.
"src/adaptive_math/verifier/symbolic.py" = ["BLE001"]
"src/adaptive_math/verifier/worker.py" = ["BLE001", "S110"]

[tool.mypy]
python_version = "3.12"
strict = true
# Run as `uv run mypy` without path arguments: the legacy src/__init__.py
# makes explicit `src/adaptive_math/...` paths resolve to a second module
# name ("src.adaptive_math.*") and conflict with the installed package.
packages = ["adaptive_math"]

[[tool.mypy.overrides]]
module = ["sympy", "sympy.*", "math_verify", "math_verify.*"]
ignore_missing_imports = true
